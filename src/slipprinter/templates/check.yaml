# Personal check front (6 x 2.75 in). The print band is narrower than a check,
# so this prints in page mode with the text rotated to run along the check.
# Positions are provisional until calibrated on real checks (issue #9).
name: check
description: Personal check, front
insert: Insert the check face up, left edge first.
orientation: rotated
page: {width: 210, height: 360, direction: 1}
size: {lines: 14, columns: 72}
fields:
  date:
    line: 2
    col: 52
    width: 14
    type: date
    default: today
  payee:
    label: Pay to the order of
    line: 5
    col: 10
    width: 40
  amount:
    line: 5
    col: 56
    width: 14
    type: money
    fill: "*"
  amount_words:
    label: Amount in words
    line: 7
    col: 2
    width: 62
    type: words
    source: amount
    fill: "*"
  memo:
    line: 11
    col: 4
    width: 30
    required: false
